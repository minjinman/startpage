[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeda-kr"
version = "0.1.0"
description = "데이터셋을 넣으면 분석 계획을 세우고 실행해 한국어 HTML 리포트를 만드는 자동 분석 도구"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "statsmodels>=0.14",
  "scikit-learn>=1.3", "matplotlib>=3.7", "jinja2>=3.1", "openpyxl>=3.1",
  "charset-normalizer>=3.0",
]

[tool.setuptools.packages.find]
include = ["autoeda*"]

[tool.setuptools.package-data]
autoeda = ["report/*.j2"]
